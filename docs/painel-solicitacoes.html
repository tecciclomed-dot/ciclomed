<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0E3A24">
<title>Painel de Solicitações · Logística CicloMed</title>
<style>
  :root{
    --verde:#1B5E3F; --verde-escuro:#0E3A24;
    --urgente:#C0392B; --media:#D68910; --baixa:#2874A6; --atend:#1E8449;
    --t-eletivo:#6C3483; --t-reserva:#148F77; --t-repos:#1F618D;
    --cinza:#6b7280; --borda:#e2e8e4;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,Arial,sans-serif;background:#eef2f0;color:#1f2a24}
  .top{
    background:linear-gradient(135deg,var(--verde-escuro),var(--verde));color:#fff;
    padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    position:sticky;top:0;z-index:30;box-shadow:0 2px 12px rgba(0,0,0,.15)
  }
  .top .logo{font-weight:800;font-size:14px;line-height:1.1}
  .top .logo small{display:block;font-weight:400;font-size:10px;opacity:.8}
  .top .title{font-size:16px;font-weight:700}
  .top .tools{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .top select{padding:8px 10px;border-radius:8px;border:0;font-size:13px;font-family:inherit}
  .top .btn{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);padding:8px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
  .top .btn:hover{background:rgba(255,255,255,.28)}
  .top .live{font-size:11px;opacity:.85;display:flex;align-items:center;gap:5px}
  .dot-live{width:8px;height:8px;border-radius:50%;background:#7CFC9A;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .hint{font-size:11px;color:#5b6b63;padding:6px 20px 0}

  .board{display:flex;gap:14px;padding:14px 16px 30px;overflow-x:auto;align-items:flex-start;min-height:70vh}
  .col{flex:0 0 320px;max-width:340px;background:#e4eae6;border-radius:14px;padding:10px;display:flex;flex-direction:column;max-height:calc(100vh - 120px)}
  .col.drop{outline:2px dashed var(--verde);outline-offset:-4px;background:#dbeee2}
  .col-h{display:flex;align-items:center;gap:8px;padding:6px 8px 10px;font-weight:800;font-size:14px;color:#fff;border-radius:9px;margin-bottom:8px}
  .col-h .cnt{margin-left:auto;background:rgba(255,255,255,.25);border-radius:20px;padding:1px 10px;font-size:12px}
  .h-URGENTE{background:var(--urgente)} .h-MEDIA{background:var(--media)} .h-BAIXA{background:var(--baixa)} .h-ATEND{background:var(--atend)}
  .cards{display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding:2px}
  .empty{color:var(--cinza);font-size:12.5px;text-align:center;padding:18px 8px;border:2px dashed #cdd6d1;border-radius:10px}

  .card{background:#fff;border:1px solid var(--borda);border-radius:11px;padding:12px 13px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:5px solid #ccc}
  .card[draggable=true]{cursor:grab}
  .card.dragging{opacity:.4}
  .card.p-URGENTE{border-left-color:var(--urgente)} .card.p-MEDIA{border-left-color:var(--media)}
  .card.p-BAIXA{border-left-color:var(--baixa)} .card.emat{border-left-color:var(--media);background:#fffdf7}
  .card.done{border-left-color:var(--atend);opacity:.85}
  .chd{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:7px}
  .badge{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;color:#fff}
  .b-URGENTE{background:var(--urgente)} .b-MEDIA{background:var(--media)} .b-BAIXA{background:var(--baixa)}
  .b-ELETIVO{background:var(--t-eletivo)} .b-RESERVA{background:var(--t-reserva)} .b-REPOSICAO{background:var(--t-repos)}
  .b-serial{background:#7d3c98}
  .proto{margin-left:auto;font-family:'Consolas',monospace;font-size:11px;color:var(--cinza)}
  .hosp{font-size:15px;font-weight:700;color:var(--verde-escuro);margin:1px 0 7px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-size:12.5px;margin-bottom:7px}
  .grid .lb{color:var(--cinza);font-size:10.5px}
  .blk{background:#f6f9f7;border:1px solid var(--borda);border-radius:7px;padding:7px 9px;font-size:12.5px;margin:5px 0;white-space:pre-wrap}
  .blk .lb{color:var(--cinza);font-size:10.5px;display:block;margin-bottom:2px}
  .blk.mono{font-family:'Consolas',monospace}
  .anx-btn{margin-left:8px;background:var(--verde);color:#fff;border:0;border-radius:6px;padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer}
  .anx-btn:hover{background:var(--verde-escuro)}
  .anx-list{margin-top:7px;display:flex;flex-direction:column;gap:5px}
  .anx-item{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--verde-escuro);text-decoration:underline;cursor:pointer}
  .anx-item:hover{color:var(--verde)}
  .anx-sz{color:var(--cinza);font-size:10.5px;text-decoration:none}
  .anx-load,.anx-none,.anx-err{font-size:11px;color:var(--cinza)}
  .anx-err{color:var(--urgente)}
  .rep{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px;margin:2px 0}
  .rep.sim{background:#fdecea;color:var(--urgente)} .rep.nao{background:#eafaf1;color:#1e8449}
  .emat-chip{display:inline-block;background:#fef3d7;color:#9a6b06;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;margin-bottom:6px}
  .cft{display:flex;align-items:center;gap:8px;margin-top:9px;padding-top:9px;border-top:1px solid #f0f3f1;flex-wrap:wrap}
  .vend{font-size:11px;color:var(--cinza);flex:1 1 100%}
  .aten{font-size:11px;color:#1e8449;font-weight:600;flex:1 1 100%}
  .doc-view{font-size:12px;color:var(--verde-escuro);font-weight:700;flex:1 1 100%}
  .act{padding:8px 14px;border-radius:8px;border:0;font-size:12.5px;font-weight:700;cursor:pointer}
  .act.at{background:var(--verde);color:#fff;margin-left:auto}
  .act.sv{background:var(--atend);color:#fff}
  .act.ca{background:#fff;color:var(--cinza);border:1px solid var(--borda)}
  .act.re{background:#fff;color:var(--cinza);border:1px solid var(--borda);margin-left:auto}
  .fld{flex:1 1 100%;margin-top:4px}
  .fld .lb2{font-size:11px;color:#9a6b06;font-weight:700;margin-bottom:3px;display:block}
  .fld input{width:100%;padding:9px 10px;border:1.5px solid var(--media);border-radius:8px;font-size:14px;font-family:inherit}
  .fld input:focus{outline:none;border-color:var(--verde)}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#26303a;color:#fff;padding:11px 18px;border-radius:22px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:0;transition:opacity .25s;z-index:99;max-width:90%;text-align:center}
  .toast.show{opacity:1}
</style>
</head>
<body>
  <div class="top">
    <div class="logo">LOGÍSTICA<small>CICLOMED DO BRASIL</small></div>
    <div class="title">📋 Painel de Solicitações</div>
    <div class="tools">
      <select id="fil" onchange="carregar()">
        <option value="">Todas as filiais</option>
        <option value="01">01 · Curitiba</option>
        <option value="02">02 · São Paulo</option>
      </select>
      <button class="btn" onclick="carregar()">↻ Atualizar</button>
      <span class="live"><span class="dot-live"></span>ao vivo</span>
    </div>
  </div>
  <div class="hint">Arraste entre <b>Urgente/Média/Baixa</b> para mudar a prioridade. Para <b>atender</b>, arraste o card (ou clique Atender) para <b>Atendidas</b> → informe <b>quem atendeu</b> + a <b>NF</b> (ou nº da reserva) → <b>Salvar</b>.</div>

  <div class="board" id="board"></div>
  <div class="toast" id="toast"></div>

<script>
  const API_BASE = 'https://ciclomed-rest.tec-ciclomed.workers.dev/rest03/WSSOLPV';
  const WORKER_BASE = 'https://ciclomed-rest.tec-ciclomed.workers.dev';
  const AUTH = 'Basic ' + btoa('admin:Ciclo@!9751!');
  const COLS = [
    {k:'URGENTE', nome:'🔴 Urgente'},
    {k:'MEDIA',   nome:'🟠 Média'},
    {k:'BAIXA',   nome:'🔵 Baixa'},
    {k:'ATEND',   nome:'✅ Atendidas'}
  ];
  const TIPO_LB = {ELETIVO:'ELETIVO', RESERVA:'RESERVA', REPOSICAO:'REPOSIÇÃO'};

  let ITENS = [];
  const anexosCache = {};
  let dragging = false, dragId = null;
  const docDraft = {};   // texto da NF/reserva digitado (preserva entre refreshes na sessao)
  const nomeDraft = {};  // nome do atendente digitado no card

  function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2800); }
  function docLabel(tipo){ return (tipo==='RESERVA') ? 'Nº da Reserva' : 'Nº da NF'; }
  function ultimoAtend(){ return localStorage.getItem('sol_atendente') || ''; }
  function editando(){ const a=document.activeElement; return a && a.classList && a.classList.contains('card-inp'); }
  function podeRecarregar(){ return !dragging && !editando(); }

  async function api(qs){
    const r = await fetch(API_BASE + '?' + qs, { headers:{ Authorization: AUTH } });
    return r.json();
  }

  async function carregar(){
    if(!podeRecarregar()) return;
    const fil = document.getElementById('fil').value;
    try{
      const o = await api('acao=solicitacoes&fil=' + encodeURIComponent(fil));
      if(!o.ok) return;
      ITENS = o.itens || [];
      render();
    }catch(e){ /* silencioso */ }
  }

  function distribui(){
    const g = {URGENTE:[],MEDIA:[],BAIXA:[],ATEND:[]};
    ITENS.forEach(p=>{
      // ATENDIDO (concluido) e EMATEND (movido p/ Atendidas, aguardando NF) ficam na coluna Atendidas
      if(p.status==='ATENDIDO' || p.status==='EMATEND') g.ATEND.push(p);
      else { const pr=(p.prioridade||'BAIXA').toUpperCase(); (g[pr]||g.BAIXA).push(p); }
    });
    return g;
  }

  function render(){
    const g = distribui();
    document.getElementById('board').innerHTML = COLS.map(col=>{
      const lista = g[col.k]||[];
      const cards = lista.length ? lista.map(cardHtml).join('') : '<div class="empty">—</div>';
      return `<div class="col" data-col="${col.k}" ondragover="onOver(event)" ondragleave="onLeave(event)" ondrop="onDrop(event,'${col.k}')">
        <div class="col-h h-${col.k}">${col.nome}<span class="cnt">${lista.length}</span></div>
        <div class="cards">${cards}</div>
      </div>`;
    }).join('');
  }

  function cardHtml(p){
    const emat = p.status==='EMATEND';
    const done = p.status==='ATENDIDO';
    const drag = !emat;
    const prCls = done ? 'done' : (emat ? 'emat' : 'p-'+esc(p.prioridade));
    const tipoCls = 'b-' + esc(p.tipo||'');
    const rep = p.reposicao ? `<span class="rep ${p.reposicao==='SIM'?'sim':'nao'}">Reposição: ${esc(p.reposicao)}</span>` : '';
    const det = [
      p.paciente ? `<div><span class="lb">Paciente</span><br>${esc(p.paciente)}</div>`:'',
      (p.dtProc||p.hrProc) ? `<div><span class="lb">Data</span><br>${esc([p.dtProc,p.hrProc].filter(Boolean).join(' '))}</div>`:'',
      p.convenio ? `<div><span class="lb">Convênio</span><br>${esc(p.convenio)}</div>`:'',
      p.medico ? `<div><span class="lb">Médico</span><br>${esc(p.medico)}</div>`:''
    ].join('');
    const blk=(lb,v,mono)=> v ? `<div class="blk${mono?' mono':''}"><span class="lb">${lb}</span>${esc(v)}</div>`:'';

    let foot='';
    if(done){
      foot = `<div class="aten">✓ Atendida por ${esc(p.atendente||'—')} · ${esc(p.dtAtend||'')}</div>
        ${p.docAtend?`<div class="doc-view">${docLabel(p.tipo)}: ${esc(p.docAtend)}</div>`:''}
        <button class="act re" onclick="reabrir('${p.id}')">Reabrir</button>`;
    } else if(emat){
      const nv = nomeDraft[p.id] != null ? nomeDraft[p.id] : (p.atendente || ultimoAtend());
      const dv = docDraft[p.id]  != null ? docDraft[p.id]  : (p.docAtend  || '');
      foot = `<span class="emat-chip">⏳ Em atendimento</span>
        <div class="fld">
          <label class="lb2">Quem está atendendo? *</label>
          <input class="card-inp" id="nom_${p.id}" value="${esc(nv)}" placeholder="Nome do atendente" oninput="nomeDraft['${p.id}']=this.value">
        </div>
        <div class="fld">
          <label class="lb2">${docLabel(p.tipo)}: *</label>
          <input class="card-inp" id="doc_${p.id}" value="${esc(dv)}" placeholder="${docLabel(p.tipo)}" oninput="docDraft['${p.id}']=this.value">
        </div>
        <div class="cft" style="border:0;padding:0;margin-top:9px;width:100%">
          <button class="act ca" onclick="cancelar('${p.id}')">Cancelar</button>
          <button class="act sv" style="margin-left:auto" onclick="salvar('${p.id}','${esc(p.tipo)}')">Salvar ✓</button>
        </div>`;
    } else {
      foot = `<div class="vend">👤 ${esc(p.vendedorNome||p.vendedor)} · ${esc(p.data)} ${esc(p.hora?p.hora.substring(0,5):'')}</div>
        <button class="act at" onclick="atender('${p.id}')">Atender</button>`;
    }

    return `<div class="card ${prCls}" ${drag?'draggable="true"':''} data-id="${p.id}"
        ondragstart="onStart(event,'${p.id}')" ondragend="onEnd(event)">
      <div class="chd">
        <span class="badge b-${esc(p.prioridade)}">${esc(p.prioridade)}</span>
        <span class="badge ${tipoCls}">${esc(TIPO_LB[p.tipo]||p.tipo)}</span>
        ${p.origem==='PEDIDOR'?'<span class="badge b-serial">🔖 SERIAL</span>':''}
        <span class="proto">${esc(p.protocolo)}</span>
      </div>
      <div class="hosp">${esc(p.hospital)||'(sem hospital)'}</div>
      ${det?`<div class="grid">${det}</div>`:''}
      ${blk('Materiais / Qtde', p.materiais)}
      ${blk('Seriais utilizados', p.seriais, true)}
      ${rep}
      ${blk('Observação', p.obs)}
      ${p.anexo?`<div class="blk"><span class="lb">📎 Anexos</span>
        <button class="anx-btn" onclick="verAnexos('${esc(p.protocolo)}','${p.id}')">Ver anexos</button>
        <div class="anx-list" id="anxl_${p.id}"></div></div>`:''}
      <div class="cft">${foot}</div>
    </div>`;
  }

  // ---------- Drag & drop ----------
  function onStart(e,id){ dragId=id; dragging=true; e.currentTarget.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',id); }
  function onEnd(e){ dragging=false; e.currentTarget.classList.remove('dragging'); }
  function onOver(e){ e.preventDefault(); e.currentTarget.classList.add('drop'); }
  function onLeave(e){ e.currentTarget.classList.remove('drop'); }

  async function onDrop(e, colK){
    e.preventDefault();
    e.currentTarget.classList.remove('drop');
    const id = dragId || e.dataTransfer.getData('text/plain');
    dragging=false;
    const p = ITENS.find(x=>x.id===id);
    if(!p) return;
    const pedR = (p.origem==='PEDIDOR');
    const fil = encodeURIComponent(p.filial||'');

    if(colK==='ATEND'){
      if(p.status==='ATENDIDO') return;
      p.status='EMATEND'; render();
      toast('Informe quem atendeu e a '+docLabel(p.tipo)+', e clique Salvar.');
      const inp=document.getElementById('nom_'+id); if(inp) inp.focus();
      if(!pedR){ try{ await api('acao=solstatus&pedido='+encodeURIComponent(id)+'&novo=EMATEND'); }catch(err){} }
      return;
    }
    const novaPr = colK;
    const reabrindo = (p.status==='ATENDIDO');
    p.prioridade = novaPr;
    if(reabrindo){ p.status='PENDENTE'; p.atendente=''; p.docAtend=''; }
    render();
    try{
      if(pedR){
        if(reabrindo) await api('acao=predatend&fil='+fil+'&pedido='+encodeURIComponent(id)+'&desfazer=1');
        await api('acao=predprior&fil='+fil+'&pedido='+encodeURIComponent(id)+'&prio='+encodeURIComponent(novaPr));
      } else {
        if(reabrindo) await api('acao=solstatus&pedido='+encodeURIComponent(id)+'&novo=PENDENTE');
        await api('acao=solprior&pedido='+encodeURIComponent(id)+'&prio='+encodeURIComponent(novaPr));
      }
    }catch(err){ carregar(); }
  }

  // ---------- Ações ----------
  async function atender(id){
    const p = ITENS.find(x=>x.id===id); if(!p) return;
    if(nomeDraft[id]==null) nomeDraft[id] = ultimoAtend();
    p.status='EMATEND'; render();
    const inp=document.getElementById('nom_'+id); if(inp){ inp.focus(); inp.select(); }
    // pedido R: EMATEND e transiente (so persiste no Salvar). Solicitacao: grava EMATEND.
    if(p.origem!=='PEDIDOR'){
      try{ await api('acao=solstatus&pedido='+encodeURIComponent(id)+'&novo=EMATEND'); }catch(e){ carregar(); }
    }
  }

  async function salvar(id, tipo){
    const elN=document.getElementById('nom_'+id), elD=document.getElementById('doc_'+id);
    const nome = ((nomeDraft[id]!=null?nomeDraft[id]:(elN?elN.value:''))||'').trim();
    const doc  = ((docDraft[id] !=null?docDraft[id] :(elD?elD.value:''))||'').trim();
    if(!nome){ toast('Obrigatório: informe quem está atendendo.'); if(elN)elN.focus(); return; }
    if(!doc){  toast('Informe a '+docLabel(tipo)+' antes de salvar.'); if(elD)elD.focus(); return; }
    localStorage.setItem('sol_atendente', nome);
    const p = ITENS.find(x=>x.id===id); if(!p) return;
    p.status='ATENDIDO'; p.docAtend=doc; p.atendente=nome; delete docDraft[id]; delete nomeDraft[id]; render();
    try{
      if(p.origem==='PEDIDOR'){
        await api('acao=predatend&fil='+encodeURIComponent(p.filial||'')+'&pedido='+encodeURIComponent(id)+'&atendente='+encodeURIComponent(nome)+'&doc='+encodeURIComponent(doc));
      } else {
        await api('acao=solstatus&pedido='+encodeURIComponent(id)+'&novo=ATENDIDO&atendente='+encodeURIComponent(nome)+'&doc='+encodeURIComponent(doc));
      }
    }catch(e){ carregar(); }
  }

  async function cancelar(id){
    const p = ITENS.find(x=>x.id===id); if(!p) return;
    p.status='PENDENTE'; p.atendente=''; delete docDraft[id]; delete nomeDraft[id]; render();
    // pedido R: nada persistido (EMATEND era transiente). Solicitacao: volta p/ PENDENTE.
    if(p.origem!=='PEDIDOR'){ try{ await api('acao=solstatus&pedido='+encodeURIComponent(id)+'&novo=PENDENTE'); }catch(e){ carregar(); } }
  }

  async function reabrir(id){
    const p = ITENS.find(x=>x.id===id); if(!p) return;
    p.status='PENDENTE'; p.atendente=''; p.docAtend=''; render();
    try{
      if(p.origem==='PEDIDOR'){ await api('acao=predatend&fil='+encodeURIComponent(p.filial||'')+'&pedido='+encodeURIComponent(id)+'&desfazer=1'); }
      else { await api('acao=solstatus&pedido='+encodeURIComponent(id)+'&novo=PENDENTE'); }
    }catch(e){ carregar(); }
  }

  // ---------- Anexos (R2 via Worker) ----------
  function fmtSize(b){ b=b||0; if(b<1024)return b+' B'; if(b<1048576)return (b/1024).toFixed(0)+' KB'; return (b/1048576).toFixed(1)+' MB'; }
  function nomeAnexo(n){ return (n||'').replace(/^\d{10,}-/, ''); }  // tira o timestamp do fallback

  async function verAnexos(protocolo, id){
    const box=document.getElementById('anxl_'+id); if(!box) return;
    box.innerHTML='<span class="anx-load">carregando…</span>';
    try{
      const r=await fetch(WORKER_BASE+'/anexo/list?protocolo='+encodeURIComponent(protocolo),{headers:{Authorization:AUTH}});
      const o=await r.json();
      if(!o.ok){ box.innerHTML='<span class="anx-err">'+esc(o.erro||'erro')+'</span>'; return; }
      if(!o.files || !o.files.length){ box.innerHTML='<span class="anx-none">Nenhum arquivo (solicitação antiga ou sem anexo real).</span>'; return; }
      anexosCache[protocolo]=o.files;
      box.innerHTML=o.files.map((f,i)=>`<a class="anx-item" onclick="abrirAnexo('${esc(protocolo)}',${i})">📄 ${esc(nomeAnexo(f.nome))} <span class="anx-sz">${fmtSize(f.size)}</span></a>`).join('');
    }catch(e){ box.innerHTML='<span class="anx-err">falha ao listar</span>'; }
  }

  async function abrirAnexo(protocolo, i){
    const f=(anexosCache[protocolo]||[])[i]; if(!f) return;
    const w=window.open('about:blank','_blank');   // abre a aba ja no clique (evita bloqueio de popup)
    try{
      const r=await fetch(WORKER_BASE+'/anexo/file?key='+encodeURIComponent(f.key),{headers:{Authorization:AUTH}});
      if(!r.ok){ if(w)w.close(); toast('Erro ao abrir anexo'); return; }
      const blob=await r.blob();
      const url=URL.createObjectURL(blob);
      if(w){ w.location=url; } else { window.open(url,'_blank'); }
      setTimeout(()=>URL.revokeObjectURL(url),120000);
    }catch(e){ if(w)w.close(); toast('Falha ao abrir anexo'); }
  }

  carregar();
  setInterval(carregar, 30000);
</script>
</body>
