<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0E3A24">
<title>Painel de Solicitações · Logística CicloMed</title>
<style>
  :root{
    --verde:#1B5E3F; --verde-escuro:#0E3A24;
    --st-aberto:#E67E22; --st-parcial:#F1C40F; --st-atend:#27AE60;
    --urgente:#C0392B; --media:#D68910; --baixa:#2874A6;
    --t-eletivo:#6C3483; --t-reserva:#148F77; --t-repos:#1F618D;
    --cinza:#6b7280; --borda:#e2e8e4;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,Arial,sans-serif;background:#eef2f0;color:#1f2a24}
  .top{background:linear-gradient(135deg,var(--verde-escuro),var(--verde));color:#fff;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:30;box-shadow:0 2px 12px rgba(0,0,0,.15)}
  .top .logo{font-weight:800;font-size:14px;line-height:1.1}
  .top .logo small{display:block;font-weight:400;font-size:10px;opacity:.8}
  .top .title{font-size:16px;font-weight:700}
  .top .tools{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .top select,.top input[type=text]{padding:8px 10px;border-radius:8px;border:0;font-size:13px;font-family:inherit}
  .top input[type=text]{width:150px}
  .top .btn{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
  .top label.chk{font-size:12px;display:flex;align-items:center;gap:5px;cursor:pointer}
  .legenda{display:flex;gap:14px;padding:7px 18px;font-size:12px;color:#4a5a52;background:#e4eae6;flex-wrap:wrap;align-items:center}
  .legenda b{color:#1f2a24}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block;vertical-align:-1px;margin-right:4px}
  .d-aberto{background:var(--st-aberto)} .d-parcial{background:var(--st-parcial)} .d-atend{background:var(--st-atend)}

  .board{display:grid;grid-template-columns:1fr 1fr 1fr minmax(235px,.85fr);gap:14px;padding:16px;max-width:1720px;margin:0 auto}
  .board.no-atend{grid-template-columns:1fr 1fr 1fr}
  @media(max-width:900px){.board,.board.no-atend{grid-template-columns:1fr}}
  .col{background:#e4eae6;border-radius:14px;padding:10px;display:flex;flex-direction:column;min-height:60px}
  .col-atend{background:#e7edf2;border:1px solid #d3dde6}
  .col-h{padding:7px 10px 11px;font-weight:800;font-size:15px;color:#fff;border-radius:9px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .col-h .cnt{margin-left:auto;background:rgba(255,255,255,.25);border-radius:20px;padding:1px 10px;font-size:12px}
  .h-ELETIVO{background:var(--t-eletivo)} .h-REPOSICAO{background:var(--t-repos)} .h-RESERVA{background:var(--t-reserva)} .h-ATEND{background:#1f3a5f}
  .cards{display:flex;flex-direction:column;gap:9px}
  .empty{color:var(--cinza);font-size:12.5px;text-align:center;padding:16px;border:2px dashed #cdd6d1;border-radius:10px}

  .card{background:#fff;border:1px solid var(--borda);border-radius:11px;padding:11px 13px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;border-left:6px solid var(--st-aberto);transition:transform .08s}
  .card:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.1)}
  .card.s-PENDENTE{border-left-color:var(--st-aberto)}
  .card.s-PARCIAL{border-left-color:var(--st-parcial);background:#fffdf3}
  .card.s-ATENDIDO{border-left-color:var(--st-atend);background:#f3fbf6}
  .chd{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:6px}
  .badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;color:#fff}
  .b-URGENTE{background:var(--urgente)} .b-MEDIA{background:var(--media)} .b-BAIXA{background:var(--baixa)}
  .bt-ELETIVO{background:var(--t-eletivo)} .bt-RESERVA{background:var(--t-reserva)} .bt-REPOSICAO{background:var(--t-repos)}
  .b-serial{background:#7d3c98}
  .proto{margin-left:auto;font-family:'Consolas',monospace;font-size:10.5px;color:var(--cinza)}
  .hosp{font-size:14.5px;font-weight:700;color:var(--verde-escuro);margin:1px 0 3px}
  .resumo{font-size:12px;color:#55605a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cat{font-size:11px;color:#1e8449;font-weight:600;margin-top:5px}
  .card.s-PARCIAL .cat{color:#9a6b06}
  .obsat{font-size:12px;color:#8a5a00;background:#fffdf3;border:1px solid #f1e0a8;border-radius:7px;padding:5px 9px;margin-top:6px;white-space:pre-wrap}

  /* card completo (nao atendidos + parciais) */
  .cardfull{cursor:default}
  .cardfull:hover{transform:none;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;font-size:12.5px;margin:7px 0 2px}
  .grid2 .lb{color:var(--cinza);font-size:10.5px;display:block;line-height:1.3}
  .blk{background:#f6f9f7;border:1px solid var(--borda);border-radius:8px;padding:7px 10px;font-size:12px;margin:6px 0;white-space:pre-wrap;line-height:1.5}
  .blk .lb{color:var(--cinza);font-size:10.5px;display:block;margin-bottom:3px}
  .blk.mono{font-family:'Consolas',monospace}
  .repos{color:#c0392b;font-weight:700;font-size:12px;margin:6px 0}
  .cardft{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:9px;border-top:1px solid #eef2f0;font-size:11px;color:var(--cinza)}
  .cardft .who{display:flex;align-items:center;gap:4px;line-height:1.3}
  .atbtn{margin-left:auto;background:var(--verde);color:#fff;border:0;border-radius:8px;padding:8px 18px;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0}
  .atbtn:hover{background:var(--verde-escuro)}
  .b-parc-inline{background:var(--st-parcial);color:#5a4700}
  /* card resumido (atendidos) */
  .cardmini .hosp{font-size:14px}
  .cardmini .sub{font-size:12px;color:#55605a;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* Modal */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:24px 12px;overflow-y:auto}
  .ov.show{display:flex}
  .modal{background:#fff;border-radius:14px;max-width:560px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
  .m-h{background:linear-gradient(135deg,var(--verde-escuro),var(--verde));color:#fff;padding:14px 18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .m-h .m-proto{font-family:'Consolas',monospace;font-size:12px;opacity:.85}
  .m-h .m-x{margin-left:auto;background:rgba(255,255,255,.2);border:0;color:#fff;width:30px;height:30px;border-radius:8px;font-size:18px;cursor:pointer}
  .m-st{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;color:#fff}
  .st-PENDENTE{background:var(--st-aberto)} .st-PARCIAL{background:var(--st-parcial);color:#5a4700} .st-ATENDIDO{background:var(--st-atend)}
  .m-b{padding:16px 18px;max-height:56vh;overflow-y:auto}
  .m-hosp{font-size:18px;font-weight:800;color:var(--verde-escuro);margin:0 0 10px}
  .m-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:13.5px;margin-bottom:10px}
  .m-grid .lb{color:var(--cinza);font-size:11px}
  .m-blk{background:#f6f9f7;border:1px solid var(--borda);border-radius:8px;padding:8px 11px;font-size:13px;margin:7px 0;white-space:pre-wrap}
  .m-blk .lb{color:var(--cinza);font-size:11px;display:block;margin-bottom:2px}
  .m-blk.mono{font-family:'Consolas',monospace}
  .anx-list{margin-top:7px;display:flex;flex-direction:column;gap:5px}
  .anx-item{font-size:12.5px;color:var(--verde-escuro);text-decoration:underline;cursor:pointer}
  .fld{margin:10px 0}
  .fld label{display:block;font-size:12.5px;font-weight:700;color:var(--verde-escuro);margin-bottom:4px}
  .fld input,.fld textarea{width:100%;padding:10px 11px;border:1.5px solid var(--borda);border-radius:9px;font-size:15px;font-family:inherit;box-sizing:border-box}
  .fld textarea{min-height:62px;resize:vertical}
  .fld input:focus,.fld textarea:focus{outline:none;border-color:var(--verde)}
  .m-f{padding:12px 18px;border-top:1px solid #eef2f0;display:flex;gap:9px;flex-wrap:wrap}
  .act{padding:11px 16px;border-radius:9px;border:0;font-size:14px;font-weight:700;cursor:pointer}
  .act.fin{background:var(--st-atend);color:#fff}
  .act.parc{background:var(--st-parcial);color:#5a4700}
  .act.exc{background:#c0392b;color:#fff}
  .act.re{background:#fff;color:var(--cinza);border:1px solid var(--borda)}
  .act.ca{background:#fff;color:var(--cinza);border:1px solid var(--borda);margin-left:auto}
  .anx-btn{background:var(--verde);color:#fff;border:0;border-radius:7px;padding:5px 11px;font-size:11.5px;font-weight:700;cursor:pointer}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#26303a;color:#fff;padding:11px 18px;border-radius:22px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:0;transition:opacity .25s;z-index:99;max-width:90%;text-align:center}
  .toast.show{opacity:1}

  /* Login + acessos */
  .loginov{position:fixed;inset:0;background:linear-gradient(135deg,#0E3A24,#1B5E3F);display:none;align-items:center;justify-content:center;z-index:60;padding:18px}
  .loginbox{background:#fff;border-radius:16px;max-width:390px;width:100%;padding:26px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .loginbox h2{margin:0 0 4px;color:var(--verde-escuro);font-size:20px}
  .loginbox p{margin:0 0 16px;color:var(--cinza);font-size:13px}
  .ac-wrap{position:relative}
  .ac-list{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--borda);border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.14);max-height:220px;overflow-y:auto;z-index:5;margin-top:3px}
  .ac-item{padding:9px 12px;cursor:pointer;font-size:14px;border-bottom:1px solid #f0f4f2}
  .ac-item:hover{background:#eef7f1}
  .ac-item small{color:var(--cinza);display:block;font-size:11px}
  .loginbtn{width:100%;background:var(--verde);color:#fff;border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:800;cursor:pointer;margin-top:6px}
  .loginbtn:hover{background:var(--verde-escuro)}
  .login-sel{background:#eef7f1;border:1px solid #cfe6da;border-radius:9px;padding:9px 12px;font-size:14px;color:var(--verde-escuro);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .login-sel .x{margin-left:auto;cursor:pointer;color:var(--cinza);font-weight:400;text-decoration:underline;font-size:12px}
  .userchip{font-size:12px;color:#eafff4;display:flex;align-items:center;gap:6px;font-weight:600}
  .ger-item{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid #eef2f0;font-size:13px}
  .ger-item .gn{font-weight:600;color:var(--verde-escuro)}
  .ger-item .gtag{font-size:10px;padding:1px 7px;border-radius:20px;background:#e7f4ec;color:#1e8449;font-weight:700}
  .ger-item .gtag.off{background:#fdecea;color:#c0392b}
  .ger-item .gbtns{margin-left:auto;display:flex;gap:6px}
  .mini-btn{border:1px solid var(--borda);background:#fff;border-radius:7px;padding:5px 9px;font-size:11px;cursor:pointer;font-weight:600}
  .mini-btn.danger{color:#c0392b;border-color:#f0c8c2}
</style>
</head>
<body>
  <div class="top">
    <div class="logo">LOGÍSTICA<small>CICLOMED DO BRASIL</small></div>
    <div class="title">📋 Painel de Solicitações</div>
    <div class="tools">
      <span class="userchip" id="userchip"></span>
      <input type="text" id="buscaNF" placeholder="🔎 Nº da NF..." autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" onblur="this.setAttribute('readonly','readonly')" oninput="render()">
      <label class="chk" id="lblOcultar"><input type="checkbox" id="ocultarFin" onchange="render()"> ocultar atendidos</label>
      <select id="fil" onchange="carregar()">
        <option value="">Todas filiais</option>
        <option value="01">01 · Curitiba</option>
        <option value="02">02 · SP</option>
      </select>
      <button class="btn" onclick="carregar()">↻</button>
      <button class="btn" id="btnGer" style="display:none" onclick="abrirGerenciar()">👤 Acessos</button>
      <button class="btn" onclick="sair()">Sair</button>
    </div>
  </div>
  <div class="legenda">
    <b>Legenda:</b>
    <span><span class="dot d-aberto"></span>Não atendido</span>
    <span><span class="dot d-parcial"></span>Parcial</span>
    <span><span class="dot d-atend"></span>Finalizado</span>
    <span style="color:#9aa4a0">· clique em Atender no card · atendidos vão pra coluna da direita (busque pela NF)</span>
  </div>

  <div class="board" id="board"></div>

  <div class="ov" id="ov" onclick="if(event.target===this)fecharModal()"><div class="modal" id="modal"></div></div>
  <div class="ov" id="ovGer" onclick="if(event.target===this)fecharGer()"><div class="modal" id="modalGer"></div></div>
  <div class="toast" id="toast"></div>

  <div class="loginov" id="login">
    <div class="loginbox">
      <h2>📋 Painel de Solicitações</h2>
      <p>Entre com seu <b>nome</b> e senha. Logística: digite <b>ESTOQUE</b>.</p>
      <div id="loginSelBox"></div>
      <div class="ac-wrap">
        <div class="fld"><label>Seu nome</label><input id="loginNome" autocomplete="off" placeholder="Digite seu nome..." oninput="loginBusca(this.value)"></div>
        <div class="ac-list" id="loginAc" style="display:none"></div>
      </div>
      <div class="fld"><label>Senha</label><input id="loginSenha" type="password" placeholder="Senha" onkeydown="if(event.key==='Enter')fazerLogin()"></div>
      <button class="loginbtn" onclick="fazerLogin()">Entrar</button>
      <div id="loginMsg" style="color:#c0392b;font-size:12.5px;margin-top:8px;min-height:16px"></div>
    </div>
  </div>

<script>
  const API_BASE = 'https://ciclomed-rest.tec-ciclomed.workers.dev/rest03/WSSOLPV';
  const WORKER_BASE = 'https://ciclomed-rest.tec-ciclomed.workers.dev';
  const AUTH = 'Basic ' + btoa('admin:Ciclo@!9751!');
  const COLS = [{k:'ELETIVO',nome:'Eletivo'},{k:'REPOSICAO',nome:'Reposição'},{k:'RESERVA',nome:'Reserva'}];
  const TIPO_LB = {ELETIVO:'ELETIVO',RESERVA:'RESERVA',REPOSICAO:'REPOSIÇÃO'};

  let ITENS = [];
  let MODAL_ID = null;
  const anexosCache = {};

  let SESS = null;      // {role, vendedor, nome, admsen}
  let POLL = null;
  let loginSel = null;  // {codigo, nome, role}
  let gerSel = null;    // {codigo, nome}

  async function apiPost(obj){
    const r=await fetch(API_BASE,{method:'POST',headers:{Authorization:AUTH,'Content-Type':'application/json'},body:JSON.stringify(obj)});
    return r.json();
  }
  function podeAtender(){return SESS && SESS.role!=='VENDEDOR';}

  // ---------- Boot / sessao ----------
  function boot(){
    try{SESS=JSON.parse(sessionStorage.getItem('sol_sess')||'null');}catch(e){SESS=null;}
    const _b=document.getElementById('buscaNF'); if(_b) _b.value='';   // zera busca (evita valor restaurado pelo browser esconder os atendidos)
    if(SESS){ aplicarSessao(); carregar(); startPoll(); }
    else { document.getElementById('login').style.display='flex'; document.getElementById('loginNome').focus(); }
  }
  function startPoll(){ if(!POLL) POLL=setInterval(carregar,30000); }
  function sair(){ sessionStorage.removeItem('sol_sess'); location.reload(); }
  function aplicarSessao(){
    document.getElementById('userchip').innerHTML='👤 '+esc(SESS.nome||SESS.vendedor||'')+(SESS.role==='LOGISTICA'?' · Logística':' · Vendedor');
    const isLog=SESS.role==='LOGISTICA';
    document.getElementById('btnGer').style.display=isLog?'':'none';
    document.getElementById('fil').style.display=isLog?'':'none';
    document.getElementById('lblOcultar').style.display=isLog?'':'none';
    if(!isLog){ document.querySelector('.legenda').innerHTML='<b>Seus pedidos.</b> <span style="color:#9aa4a0">Você vê apenas as solicitações e reservas ligadas ao seu código de vendedor.</span>'; }
  }

  // ---------- Login ----------
  let _acTmr=null;
  function loginBusca(q){
    loginSel=null; document.getElementById('loginSelBox').innerHTML='';
    q=(q||'').trim();
    const box=document.getElementById('loginAc');
    if(q.length<2){ box.style.display='none'; box.innerHTML=''; return; }
    clearTimeout(_acTmr);
    _acTmr=setTimeout(async()=>{
      let itens=[];
      if('ESTOQUE'.startsWith(q.toUpperCase())||q.toUpperCase()==='LOGISTICA'){ itens.push({codigo:'ESTOQUE',nome:'ESTOQUE — Logística',role:'LOGISTICA'}); }
      try{
        const o=await api('acao=identificar&q='+enc(q));
        if(o.ok&&o.pessoas){ o.pessoas.filter(p=>p.tipo==='V').forEach(p=>itens.push({codigo:p.codigo,nome:p.nome,role:'VENDEDOR'})); }
      }catch(e){}
      if(!itens.length){ box.style.display='none'; box.innerHTML=''; return; }
      box.innerHTML=itens.map((p,i)=>`<div class="ac-item" onclick="loginPick(${i})"><b>${esc(p.nome)}</b><small>${p.role==='LOGISTICA'?'Logística':'Vendedor '+esc(p.codigo)}</small></div>`).join('');
      box._itens=itens; box.style.display='block';
    },220);
  }
  function loginPick(i){
    const box=document.getElementById('loginAc'); const p=(box._itens||[])[i]; if(!p)return;
    loginSel=p;
    document.getElementById('loginNome').value=p.nome;
    document.getElementById('loginSelBox').innerHTML=`<div class="login-sel">✓ ${esc(p.nome)} <span class="x" onclick="limparLoginSel()">trocar</span></div>`;
    box.style.display='none';
    document.getElementById('loginSenha').focus();
  }
  function limparLoginSel(){ loginSel=null; document.getElementById('loginSelBox').innerHTML=''; document.getElementById('loginNome').value=''; document.getElementById('loginNome').focus(); }
  async function fazerLogin(){
    const msg=document.getElementById('loginMsg'); msg.style.color='#c0392b'; msg.textContent='';
    const senha=(document.getElementById('loginSenha').value||'');
    let user=loginSel;
    if(!user){
      const t=(document.getElementById('loginNome').value||'').trim();
      if(t.toUpperCase()==='ESTOQUE') user={codigo:'ESTOQUE',nome:'Logística',role:'LOGISTICA'};
    }
    if(!user){ msg.textContent='Escolha seu nome na lista.'; return; }
    if(!senha){ msg.textContent='Informe a senha.'; return; }
    msg.style.color='#6b7280'; msg.textContent='Entrando...';
    try{
      const o=await api('acao=painellogin&vendedor='+enc(user.codigo)+'&senha='+enc(senha));
      if(!o.ok){ msg.style.color='#c0392b'; msg.textContent=o.msg||'Usuário ou senha inválidos.'; return; }
      SESS={role:o.role,vendedor:o.vendedor||'',nome:o.nome||user.nome||'',admsen:(o.role==='LOGISTICA'?senha:'')};
      sessionStorage.setItem('sol_sess',JSON.stringify(SESS));
      document.getElementById('login').style.display='none';
      aplicarSessao(); carregar(); startPoll();
    }catch(e){ msg.style.color='#c0392b'; msg.textContent='Falha de conexão.'; }
  }

  // ---------- Gerenciar acessos (logistica) ----------
  function abrirGerenciar(){
    if(!SESS||SESS.role!=='LOGISTICA')return;
    gerSel=null;
    document.getElementById('modalGer').innerHTML=`
      <div class="m-h"><span style="font-weight:700">👤 Acessos dos vendedores</span><button class="m-x" onclick="fecharGer()">×</button></div>
      <div class="m-b">
        <div class="ac-wrap">
          <div class="fld"><label>Vendedor</label><input id="gerNome" autocomplete="off" placeholder="Buscar vendedor pelo nome..." oninput="gerBusca(this.value)"></div>
          <div class="ac-list" id="gerAc" style="display:none"></div>
        </div>
        <div id="gerSelBox"></div>
        <div class="fld"><label>Senha de acesso</label><input id="gerSenha" placeholder="Defina a senha do vendedor"></div>
        <button class="loginbtn" style="margin-top:0" onclick="gerSalvar()">Salvar acesso</button>
        <div id="gerMsg" style="font-size:12.5px;margin-top:8px;min-height:16px"></div>
        <hr style="border:0;border-top:1px solid #eef2f0;margin:14px 0">
        <div style="font-weight:700;color:var(--verde-escuro);font-size:13px;margin-bottom:6px">Acessos cadastrados</div>
        <div id="gerLista">carregando…</div>
      </div>
      <div class="m-f"><button class="act ca" onclick="fecharGer()">Fechar</button></div>`;
    document.getElementById('ovGer').classList.add('show');
    gerListar();
  }
  function fecharGer(){ document.getElementById('ovGer').classList.remove('show'); }
  let _gerTmr=null;
  function gerBusca(q){
    gerSel=null; document.getElementById('gerSelBox').innerHTML='';
    q=(q||'').trim(); const box=document.getElementById('gerAc');
    if(q.length<2){ box.style.display='none'; return; }
    clearTimeout(_gerTmr);
    _gerTmr=setTimeout(async()=>{
      let itens=[];
      try{ const o=await api('acao=identificar&q='+enc(q)); if(o.ok&&o.pessoas) itens=o.pessoas.filter(p=>p.tipo==='V'); }catch(e){}
      if(!itens.length){ box.style.display='none'; box.innerHTML=''; return; }
      box.innerHTML=itens.map((p,i)=>`<div class="ac-item" onclick="gerPick(${i})"><b>${esc(p.nome)}</b><small>Vendedor ${esc(p.codigo)}</small></div>`).join('');
      box._itens=itens; box.style.display='block';
    },220);
  }
  function gerPick(i){
    const box=document.getElementById('gerAc'); const p=(box._itens||[])[i]; if(!p)return;
    gerSel={codigo:p.codigo,nome:p.nome};
    document.getElementById('gerNome').value=p.nome;
    document.getElementById('gerSelBox').innerHTML=`<div class="login-sel">✓ ${esc(p.nome)} · ${esc(p.codigo)} <span class="x" onclick="gerLimpar()">trocar</span></div>`;
    box.style.display='none';
  }
  function gerLimpar(){ gerSel=null; document.getElementById('gerSelBox').innerHTML=''; document.getElementById('gerNome').value=''; }
  async function gerSalvar(){
    const msg=document.getElementById('gerMsg'); msg.style.color='#c0392b';
    if(!gerSel){ msg.textContent='Escolha o vendedor.'; return; }
    const senha=(document.getElementById('gerSenha').value||'').trim();
    if(!senha){ msg.textContent='Defina a senha.'; return; }
    msg.style.color='#6b7280'; msg.textContent='Salvando...';
    try{
      const o=await apiPost({op:'SETACESSO',admsen:SESS.admsen,vendedor:gerSel.codigo,nome:gerSel.nome,senha:senha,ativo:'S'});
      if(!o.ok){ msg.style.color='#c0392b'; msg.textContent=o.msg||'Erro ao salvar.'; return; }
      msg.style.color='#1e8449'; msg.textContent='Acesso salvo! O vendedor já pode entrar no app e no painel.';
      document.getElementById('gerSenha').value=''; gerLimpar();
      gerListar();
    }catch(e){ msg.style.color='#c0392b'; msg.textContent='Falha de conexão.'; }
  }
  async function gerListar(){
    const box=document.getElementById('gerLista'); if(!box)return;
    try{
      const o=await api('acao=acessolist&senha='+enc(SESS.admsen));
      if(!o.ok){ box.innerHTML='<span style="color:#c0392b">'+(o.msg||'erro')+'</span>'; return; }
      if(!o.itens||!o.itens.length){ box.innerHTML='<span style="color:#9aa4a0">Nenhum acesso cadastrado.</span>'; return; }
      box.innerHTML=o.itens.map(u=>`<div class="ger-item">
        <span class="gn">${esc(u.nome||u.vendedor)}</span>
        <span class="gtag${u.ativo==='S'?'':' off'}">${u.ativo==='S'?'ativo':'inativo'}</span>
        <span class="gbtns">
          <button class="mini-btn" onclick="gerReset('${esc(u.vendedor)}','${esc((u.nome||'').replace(/'/g,''))}')">Trocar senha</button>
          <button class="mini-btn danger" onclick="gerRemover('${esc(u.vendedor)}')">Remover</button>
        </span></div>`).join('');
    }catch(e){ box.innerHTML='<span style="color:#c0392b">falha ao listar</span>'; }
  }
  function gerReset(cod,nome){ gerSel={codigo:cod,nome:nome}; document.getElementById('gerNome').value=nome; document.getElementById('gerSelBox').innerHTML=`<div class="login-sel">✓ ${esc(nome)} · ${esc(cod)} <span class="x" onclick="gerLimpar()">trocar</span></div>`; document.getElementById('gerSenha').focus(); }
  async function gerRemover(cod){
    if(!confirm('Remover o acesso do vendedor '+cod+'?'))return;
    try{ const o=await apiPost({op:'DELACESSO',admsen:SESS.admsen,vendedor:cod}); if(o.ok) gerListar(); else toast(o.msg||'erro'); }catch(e){ toast('falha'); }
  }

  const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const enc = s => encodeURIComponent(s||'');
  function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}
  function docLabel(t){return t==='RESERVA'?'Nº da Reserva':'Nº da NF';}
  function ultimoAtend(){return localStorage.getItem('sol_atendente')||'';}
  function nomeAnexo(n){return (n||'').replace(/^\d{10,}-/,'');}
  function fmtSize(b){b=b||0;if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(0)+' KB';return (b/1048576).toFixed(1)+' MB';}
  function podeRecarregar(){return !MODAL_ID && document.activeElement!==document.getElementById('buscaNF');}

  async function api(qs){const r=await fetch(API_BASE+'?'+qs,{headers:{Authorization:AUTH}});return r.json();}

  async function carregar(){
    if(!SESS)return;
    if(!podeRecarregar())return;
    const fil=document.getElementById('fil').value;
    let qs='acao=solicitacoes&fil='+enc(fil);
    if(SESS.role==='VENDEDOR') qs+='&vendedor='+enc(SESS.vendedor);
    try{const o=await api(qs);if(!o.ok)return;ITENS=o.itens||[];render();}catch(e){}
  }

  function distribui(){
    const pend={ELETIVO:[],REPOSICAO:[],RESERVA:[]};   // colunas por tipo = so o que esta pendente/parcial
    const atend=[];                                     // coluna da direita = todos os atendidos
    const nf=(document.getElementById('buscaNF').value||'').trim().toUpperCase();
    ITENS.forEach(p=>{
      if(p.status==='ATENDIDO'){
        if(nf && !(p.docAtend||'').toUpperCase().includes(nf))return;         // busca por NF filtra a coluna de atendidos
        atend.push(p);
      }else{
        const t=(p.tipo||'').toUpperCase();
        if(pend[t]) pend[t].push(p);
      }
    });
    return {pend,atend};
  }

  function render(){
    const {pend,atend}=distribui();
    const nf=(document.getElementById('buscaNF').value||'').trim();
    const showAtend=!document.getElementById('ocultarFin').checked || nf!=='';
    const board=document.getElementById('board');
    let html=COLS.map(c=>{
      const l=pend[c.k]||[];
      const cards=l.length?l.map(cardFull).join(''):'<div class="empty">—</div>';
      return `<div class="col"><div class="col-h h-${c.k}">${c.nome}<span class="cnt">${l.length}</span></div><div class="cards">${cards}</div></div>`;
    }).join('');
    if(showAtend){
      const cardsA=atend.length?atend.map(cardMini).join(''):('<div class="empty">'+(nf?('nenhum atendido para a busca "'+esc(nf)+'" · <a href="#" onclick="document.getElementById(\'buscaNF\').value=\'\';render();return false;">limpar</a>'):'nenhum atendido')+'</div>');
      html+=`<div class="col col-atend"><div class="col-h h-ATEND">✓ PEDIDOS ATENDIDOS<span class="cnt">${atend.length}</span></div><div class="cards">${cardsA}</div></div>`;
    }
    board.classList.toggle('no-atend',!showAtend);
    board.innerHTML=html;
  }

  // card COMPLETO — nao atendidos + parciais (o que chega fica com todo detalhe)
  function cardFull(p){
    const grid=[
      p.paciente?['Paciente',p.paciente]:null,
      (p.dtProc||p.hrProc)?['Data e Hora',[p.dtProc,p.hrProc].filter(Boolean).join(' ')]:null,
      p.convenio?['Convênio',p.convenio]:null,
      p.medico?['Médico',p.medico]:null
    ].filter(Boolean).map(x=>`<div><span class="lb">${x[0]}</span>${esc(x[1])}</div>`).join('');
    const mat=p.materiais?`<div class="blk"><span class="lb">Materiais / Qtde</span>${esc(p.materiais)}</div>`:'';
    const ser=p.seriais?`<div class="blk mono"><span class="lb">Seriais utilizados</span>${esc(p.seriais)}</div>`:'';
    const rep=p.reposicao?`<div class="repos">Reposição: ${esc(p.reposicao)}</div>`:'';
    const obs=p.obs?`<div class="blk"><span class="lb">Observação</span>${esc(p.obs)}</div>`:'';
    const anx=(p.anexo||p.origem==='PEDIDOR')?`<div class="blk"><span class="lb">📎 Anexos</span>
        <button class="anx-btn" onclick="verAnexos('${esc(p.anexoProto||p.protocolo)}','anx-${esc(p.id)}')">Ver anexos</button>
        <div class="anx-list" id="anx-${esc(p.id)}"></div></div>`:'';
    const parc=p.status==='PARCIAL'&&p.atendente?`<div class="cat">🟡 Parcial por ${esc(p.atendente)}${p.docAtend?(' · '+docLabel(p.tipo)+' '+esc(p.docAtend)):''}</div>`:'';
    const obsAt=p.obsAtend?`<div class="obsat">🚚 ${esc(p.obsAtend)}</div>`:'';
    return `<div class="card cardfull s-${esc(p.status)}">
      <div class="chd">
        <span class="badge b-${esc(p.prioridade)}">${esc(p.prioridade)}</span>
        <span class="badge bt-${esc(p.tipo)}">${esc(TIPO_LB[p.tipo]||p.tipo)}</span>
        ${p.origem==='PEDIDOR'?'<span class="badge b-serial">🔖</span>':''}
        ${p.status==='PARCIAL'?'<span class="badge b-parc-inline">PARCIAL</span>':''}
        <span class="proto">${esc(p.protocolo)}</span>
      </div>
      <div class="hosp">${esc(p.hospital)||'(sem hospital)'}</div>
      ${grid?`<div class="grid2">${grid}</div>`:''}
      ${mat}${ser}${rep}${obs}${anx}${parc}${obsAt}
      <div class="cardft">
        <span class="who">👤 ${esc(p.vendedorNome||p.vendedor||'')} · ${esc(p.data)} ${p.hora?esc(p.hora.substring(0,5)):''}</span>
        <button class="atbtn" onclick="abrirModal('${esc(p.id)}')">${p.status==='PARCIAL'?'Continuar':'Atender'}</button>
      </div>
    </div>`;
  }

  // card RESUMIDO — atendidos (fica pequeno pra tela nao crescer)
  function cardMini(p){
    return `<div class="card cardmini s-${esc(p.status)}" onclick="abrirModal('${esc(p.id)}')">
      <div class="chd">
        <span class="badge b-${esc(p.prioridade)}">${esc(p.prioridade)}</span>
        <span class="badge bt-${esc(p.tipo)}">${esc(TIPO_LB[p.tipo]||p.tipo)}</span>
        ${p.origem==='PEDIDOR'?'<span class="badge b-serial">🔖</span>':''}
        <span class="proto">${esc(p.protocolo)}</span>
      </div>
      <div class="hosp">${esc(p.hospital)||'(sem hospital)'}</div>
      ${p.paciente?`<div class="sub">${esc(p.paciente)}</div>`:''}
      <div class="cat">✓ ${esc(p.atendente||'')}${p.docAtend?(' · '+docLabel(p.tipo)+' '+esc(p.docAtend)):''}</div>
      ${p.obsAtend?`<div class="obsat">🚚 ${esc(p.obsAtend)}</div>`:''}
    </div>`;
  }

  // ---------- Modal ----------
  function abrirModal(id){
    const p=ITENS.find(x=>x.id===id);if(!p)return;
    MODAL_ID=id;
    const blk=(lb,v,mono)=>v?`<div class="m-blk${mono?' mono':''}"><span class="lb">${lb}</span>${esc(v)}</div>`:'';
    const linha=(lb,v)=>v?`<div><span class="lb">${lb}</span><br>${esc(v)}</div>`:'';
    const jaAt = p.status!=='PENDENTE';
    document.getElementById('modal').innerHTML=`
      <div class="m-h">
        <span class="badge b-${esc(p.prioridade)}">${esc(p.prioridade)}</span>
        <span class="badge bt-${esc(p.tipo)}">${esc(TIPO_LB[p.tipo]||p.tipo)}</span>
        ${p.origem==='PEDIDOR'?'<span class="badge b-serial">🔖 SERIAL</span>':''}
        <span class="m-st st-${esc(p.status)}">${p.status==='ATENDIDO'?'FINALIZADO':(p.status==='PARCIAL'?'PARCIAL':'EM ABERTO')}</span>
        <span class="m-proto">${esc(p.protocolo)}</span>
        <button class="m-x" onclick="fecharModal()">×</button>
      </div>
      <div class="m-b">
        <div class="m-hosp"><span style="display:block;font-size:11px;color:#6b7280;font-weight:600;letter-spacing:.3px">Hospital</span>${esc(p.hospital)||'(sem hospital)'}</div>
        <div class="m-grid">
          ${linha('Paciente',p.paciente)}
          ${linha('Data e Hora',[p.dtProc,p.hrProc].filter(Boolean).join(' '))}
          ${linha('Convênio',p.convenio)}
          ${linha('Médico',p.medico)}
          ${linha('Vendedor',p.vendedorNome||p.vendedor)}
          ${linha('Criado',p.data+' '+(p.hora?p.hora.substring(0,5):''))}
        </div>
        ${blk('Materiais / Qtde',p.materiais)}
        ${blk('Seriais utilizados',p.seriais,true)}
        ${p.reposicao?`<div class="m-blk"><span class="lb">Necessário reposição</span>${esc(p.reposicao)}</div>`:''}
        ${blk('Observação',p.obs)}
        ${(p.anexo||p.origem==='PEDIDOR')?`<div class="m-blk"><span class="lb">📎 Anexos</span>
           <button class="anx-btn" onclick="verAnexos('${esc(p.anexoProto||p.protocolo)}')">Ver anexos</button>
           <div class="anx-list" id="anxl"></div></div>`:''}
        ${podeAtender()?`<div class="fld"><label>Quem está atendendo? *</label><input id="m_nome" value="${esc(p.atendente||ultimoAtend())}" placeholder="Nome do atendente"></div>
        <div class="fld"><label>${docLabel(p.tipo)}: * (obrigatório p/ finalizar)</label><input id="m_doc" value="${esc(p.docAtend||'')}" placeholder="${docLabel(p.tipo)}"></div>
        <div class="fld"><label>Observação</label><textarea id="m_obs" placeholder="Ex.: material a caminho; faltam alguns itens…">${esc(p.obsAtend||'')}</textarea></div>`:(p.atendente?`<div class="m-blk"><span class="lb">Atendimento</span>✓ ${esc(p.atendente)}${p.docAtend?(' · '+docLabel(p.tipo)+' '+esc(p.docAtend)):''}</div>${p.obsAtend?`<div class="m-blk"><span class="lb">Observação do atendimento</span>${esc(p.obsAtend)}</div>`:''}`:'<div class="m-blk" style="color:#9aa4a0">Ainda não atendido.</div>')}
      </div>
      <div class="m-f">
        ${podeAtender()?`<button class="act fin" onclick="atender('${esc(p.id)}','ATENDIDO')">✓ Finalizar</button>
        <button class="act parc" onclick="atender('${esc(p.id)}','PARCIAL')">🟡 Parcial</button>
        ${jaAt?`<button class="act re" onclick="reabrir('${esc(p.id)}')">Reabrir</button>`:''}
        <button class="act exc" onclick="excluirCard('${esc(p.id)}')">🗑️ Excluir</button>`:''}
        <button class="act ca" onclick="fecharModal()">Fechar</button>
      </div>`;
    document.getElementById('ov').classList.add('show');
  }
  function fecharModal(){MODAL_ID=null;document.getElementById('ov').classList.remove('show');}

  // ---------- Excluir o card aberto (logistica) ----------
  // pedido R -> exclui o pedido de venda (SC5, com checagem de NF); solicitacao -> remove a ZSOLICITACAO
  async function excluirCard(id){
    const p=ITENS.find(x=>x.id===id);if(!p)return;
    const admsen=enc((SESS&&SESS.admsen)||'');
    let qs;
    if(p.origem==='PEDIDOR'){
      if(!confirm('EXCLUIR o pedido '+(p.protocolo||id)+'?\n\nEsta ação não pode ser desfeita.'))return;
      qs='acao=excpedido&fil='+enc(p.filial||'')+'&pedido='+enc(id)+'&admsen='+admsen;
    }else{
      if(!confirm('EXCLUIR a solicitação '+(p.protocolo||id)+'?\n\nEsta ação não pode ser desfeita.'))return;
      qs='acao=excsolic&pedido='+enc(id)+'&admsen='+admsen;
      // Este card tem pedido de venda? Se sim, digita o numero e apaga SC5/SC6 no Protheus.
      if(confirm('Este card tem pedido de venda no Protheus?\n\nSe SIM, você vai digitar o número e ele será excluído (SC5/SC6) junto com o card.')){
        const pv=(prompt('Digite o número do pedido de venda a excluir no Protheus:')||'').trim();
        if(pv) qs+='&pedvdel='+enc(pv)+'&fil='+enc(p.filial||'');
      }
    }
    try{
      const r=await api(qs);
      if(r&&r.ok){toast(r.msg||'Excluído.');fecharModal();carregar();return;}
      toast((r&&r.msg)||'Não foi possível excluir.');
    }catch(e){toast('Erro ao excluir.');}
  }

  async function atender(id,novo){
    const p=ITENS.find(x=>x.id===id);if(!p)return;
    const nome=(document.getElementById('m_nome').value||'').trim();
    const doc=(document.getElementById('m_doc').value||'').trim();
    const obs=((document.getElementById('m_obs')||{}).value||'').trim();
    if(!nome){toast('Informe quem está atendendo.');return;}
    if(novo==='ATENDIDO' && !doc){toast('Informe a '+docLabel(p.tipo)+' para finalizar.');return;}
    localStorage.setItem('sol_atendente',nome);
    p.status=novo;p.atendente=nome;p.docAtend=doc;p.obsAtend=obs;
    fecharModal();render();
    try{
      if(p.origem==='PEDIDOR') await api('acao=predatend&fil='+enc(p.filial||'')+'&pedido='+enc(id)+'&atendente='+enc(nome)+'&doc='+enc(doc)+'&novo='+novo+'&obs='+enc(obs));
      else await api('acao=solstatus&pedido='+enc(id)+'&novo='+novo+'&atendente='+enc(nome)+'&doc='+enc(doc)+'&obs='+enc(obs));
    }catch(e){carregar();}
  }
  async function reabrir(id){
    const p=ITENS.find(x=>x.id===id);if(!p)return;
    p.status='PENDENTE';p.atendente='';p.docAtend='';
    fecharModal();render();
    try{
      if(p.origem==='PEDIDOR') await api('acao=predatend&fil='+enc(p.filial||'')+'&pedido='+enc(id)+'&desfazer=1');
      else await api('acao=solstatus&pedido='+enc(id)+'&novo=PENDENTE');
    }catch(e){carregar();}
  }

  // ---------- Anexos (R2) ----------
  async function verAnexos(protocolo,boxId){
    const box=document.getElementById(boxId||'anxl');if(!box)return;
    box.innerHTML='carregando…';
    try{
      const r=await fetch(WORKER_BASE+'/anexo/list?protocolo='+enc(protocolo),{headers:{Authorization:AUTH}});
      const o=await r.json();
      if(!o.ok){box.innerHTML='erro';return;}
      if(!o.files||!o.files.length){box.innerHTML='<span style="color:#9aa4a0">Nenhum anexo.</span>';return;}
      anexosCache[protocolo]=o.files;
      box.innerHTML=o.files.map((f,i)=>`<a class="anx-item" onclick="abrirAnexo('${esc(protocolo)}',${i})">📄 ${esc(nomeAnexo(f.nome))} (${fmtSize(f.size)})</a>`).join('');
    }catch(e){box.innerHTML='falha ao listar';}
  }
  async function abrirAnexo(protocolo,i){
    const f=(anexosCache[protocolo]||[])[i];if(!f)return;
    const w=window.open('about:blank','_blank');
    try{
      const r=await fetch(WORKER_BASE+'/anexo/file?key='+enc(f.key),{headers:{Authorization:AUTH}});
      if(!r.ok){if(w)w.close();toast('Erro ao abrir');return;}
      const url=URL.createObjectURL(await r.blob());
      if(w)w.location=url;else window.open(url,'_blank');
      setTimeout(()=>URL.revokeObjectURL(url),120000);
    }catch(e){if(w)w.close();toast('Falha ao abrir anexo');}
  }

  boot();
</script>
</body>
</html>
